<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>羊村基金涨跌榜 · 数据管理</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background:#f0f3fb; color:#20242e; padding:20px; max-width:1080px; margin:0 auto; }
  h1 { font-size:20px; margin-bottom:2px; }
  .sub { color:#7b8294; font-size:12px; margin-bottom:16px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
  .kpi { background:#fff; border-radius:12px; padding:14px 16px; box-shadow:0 2px 8px rgba(30,40,90,.06); }
  .kpi .l { font-size:12px; color:#7b8294; margin-bottom:6px; }
  .kpi .v { font-size:20px; font-weight:700; }
  .card { background:#fff; border-radius:12px; box-shadow:0 2px 8px rgba(30,40,90,.06); padding:16px 18px; margin-bottom:14px; }
  .card h2 { font-size:15px; margin-bottom:12px; display:flex; align-items:center; justify-content:space-between; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; color:#7b8294; font-weight:600; padding:7px 6px; border-bottom:2px solid #eef1f8; font-size:12px; }
  td { padding:7px 6px; border-bottom:1px solid #f1f3f9; }
  tr:hover td { background:#f8faff; }
  .up { color:#d93b34; } .down { color:#0e9f6e; } .flat { color:#8a90a0; }
  .tag { display:inline-block; padding:1px 8px; border-radius:10px; font-size:11px; }
  .tag-pend { background:#fff3df; color:#c77700; }
  .tag-ok { background:#e3f4ec; color:#0e9f6e; }
  .tag-tr { background:#e8ecff; color:#2d3a8c; }
  .btn { border:0; border-radius:7px; padding:4px 10px; font-size:12px; cursor:pointer; }
  .btn-p { background:#2d3a8c; color:#fff; }
  .btn-g { background:#eef1f8; color:#444; }
  .btn-d { background:#fce9e7; color:#d93b34; }
  .btn:hover { opacity:.9; }
  .row-actions button { margin-right:4px; }
  input, select { padding:7px 10px; border:1px solid #dfe4f0; border-radius:8px; font-size:13px; }
  .pill { font-size:12px; color:#7b8294; font-weight:400; }
  .crown { color:#f5b301; }
  details { margin-bottom:14px; }
  details > summary { cursor:pointer; list-style:none; background:#fff; border-radius:12px; padding:12px 16px; box-shadow:0 2px 8px rgba(30,40,90,.06); font-size:14px; font-weight:600; }
  details[open] > summary { border-radius:12px 12px 0 0; }
  details .card { box-shadow:none; border-radius:0 0 12px 12px; margin-bottom:0; }
  .formgrid { display:grid; grid-template-columns:1fr 1fr 1.5fr 1fr auto; gap:8px; align-items:end; margin-bottom:10px; }
  #toast { position:fixed; top:16px; right:16px; background:#222; color:#fff; padding:10px 16px; border-radius:8px; font-size:13px; opacity:0; transition:.3s; pointer-events:none; z-index:9; }
  .modal-overlay { position:fixed; inset:0; background:rgba(20,25,45,.45); display:none; align-items:center; justify-content:center; z-index:20; }
  .modal { background:#fff; border-radius:14px; width:460px; max-width:94vw; padding:22px; box-shadow:0 8px 30px rgba(20,30,60,.25); }
  .modal h3 { margin-bottom:14px; font-size:16px; }
  .modal .f { display:grid; grid-template-columns:1fr; gap:10px; margin-bottom:14px; }
  .modal label { font-size:12px; color:#5b6270; }
  .modal input, .modal select { padding:8px 10px; border:1px solid #dfe4f0; border-radius:8px; font-size:13px; width:100%; }
  .modal .btns { display:flex; justify-content:flex-end; gap:8px; }
  .conv { display:flex; align-items:center; justify-content:space-between; background:#f3f5ff; border:1px solid #dfe4f5; border-radius:10px; padding:10px 14px; font-size:13px; }
</style>
</head>
<body>
<div id="toast"></div>
<h1>🐑 羊村基金涨跌榜 · 数据管理</h1>
<div class="sub">直接读写 fund.db，改动即时生效；涨跌由每日 20:00 自动更新。</div>

<div class="kpis" id="kpis"></div>

<div class="card" id="convCard" style="display:none">
  <h2>🔄 在途转换 <span class="pill">转出日晚自动按净值结算挂账</span></h2>
  <div id="convList"></div>
</div>

<div class="card">
  <h2>📊 涨跌榜总览 <span class="pill">红涨绿跌 · 点成员名筛选明细</span></h2>
  <table id="summaryTable"><thead><tr><th>成员</th><th>当日涨幅</th><th>本金</th><th>现资金</th><th>盈亏(含已实现)</th><th>已实现</th><th>基金数</th></tr></thead><tbody></tbody></table>
</div>

<div class="card">
  <h2>📁 成员基金明细 <span id="recFilter" class="pill"></span></h2>
  <table id="recTable"><thead><tr><th>成员</th><th>基金</th><th>本金</th><th>现资金</th><th>涨跌%</th><th>已实现</th><th>状态</th><th>操作</th></tr></thead><tbody></tbody></table>
</div>

<details>
  <summary>➕ 新增成员基金 / ⏰ 预约确认（点开展开）</summary>
  <div class="card">
    <div class="formgrid">
      <input id="aMember" list="memberList" placeholder="成员昵称" required>
      <input id="aCode" placeholder="代码(6位)" required maxlength="6">
      <input id="aName" placeholder="名称(可选)">
      <input id="aPrincipal" type="number" step="0.01" placeholder="本金 ¥" required>
      <button class="btn btn-p" onclick="addRec()">新增</button>
    </div>
    <div style="border-top:1px dashed #e6e9f2;margin:10px 0"></div>
    <div class="formgrid" style="grid-template-columns:1fr 1.6fr 1.4fr auto">
      <input id="sMember" list="memberList" placeholder="成员昵称">
      <select id="sFund"><option value="">先选成员再选基金</option></select>
      <input id="sAt" placeholder="确认时间 YYYY-MM-DD HH:MM">
      <button class="btn btn-p" onclick="addSchedule()">存预约</button>
    </div>
  </div>
</details>

<details>
  <summary>👥 群成员概览（含暂无数据的成员）</summary>
  <div class="card">
    <table id="memberTable"><thead><tr><th>成员</th><th>基金数</th><th>本金</th><th>现资金</th><th>盈亏(含已实现)</th><th>已实现</th><th>待确认</th></tr></thead><tbody></tbody></table>
  </div>
</details>

<details>
  <summary>⏰ 预约确认计划列表</summary>
  <div class="card">
    <table id="scheduleTable"><thead><tr><th>成员</th><th>基金</th><th>确认时间</th><th>操作</th></tr></thead><tbody></tbody></table>
  </div>
</details>

<datalist id="memberList"></datalist>

<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h3>✏️ 编辑成员基金</h3>
    <div class="f">
      <label>成员昵称</label><input id="eMember" list="memberList">
      <label>基金代码（6位）</label><input id="eCode" maxlength="6">
      <label>基金名称</label><input id="eName">
      <label>本金 ¥（改了会重置现资金）</label><input id="ePrincipal" type="number" step="0.01">
      <label>确认状态</label>
      <select id="eConfirmed"><option value="1">已确认（参与每日更新）</option><option value="0">待确认（不更新）</option></select>
    </div>
    <div class="btns">
      <button class="btn btn-g" onclick="closeModal()">取消</button>
      <button class="btn btn-p" onclick="saveEdit()">保存</button>
    </div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const page=()=>window.AstrBotPluginPage;
let currentFilter='';
function toast(t){const e=$('#toast');e.textContent=t;e.style.opacity=1;clearTimeout(e._t);e._t=setTimeout(()=>e.style.opacity=0,2200);}
function sign(v){return v>0?`+${v.toFixed(2)}`:v.toFixed(2);}
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function bridgeReady(){return new Promise(res=>{(function chk(){if(window.AstrBotPluginPage)res(window.AstrBotPluginPage);else setTimeout(chk,50);})();});}
async function g(ep){try{return await page().apiGet(ep);}catch(err){toast('加载失败：'+((err&&err.message)||ep));return[];}}
async function p(ep,body){try{return await page().apiPost(ep,body||{});}catch(err){return{ok:false,error:(err&&err.message)||'请求失败'};}}

async function loadKpis(){
  const rows=await g('api/summary');
  let P=0,C=0,chg=0,pnl=0,real=0;
  rows.forEach(r=>{P+=r.principal;C+=r.current;chg+=r.day_chg*r.current/100;
                   pnl+=(r.pnl||0);real+=(r.realized||0);});
  const pc=pnl>=0?'up':'down';
  $('#kpis').innerHTML=`
    <div class="kpi"><div class="l">总本金</div><div class="v">¥${P.toFixed(0)}</div></div>
    <div class="kpi"><div class="l">总现资金</div><div class="v">¥${C.toFixed(0)}</div></div>
    <div class="kpi"><div class="l">总盈亏（含已实现）</div><div class="v ${pc}">${sign(pnl)}</div></div>
    <div class="kpi"><div class="l">已实现盈亏</div><div class="v ${real>=0?'up':'down'}">${sign(real)}</div></div>
    <div class="kpi"><div class="l">当日变动</div><div class="v ${chg>=0?'up':'down'}">${sign(chg)}</div></div>`;
}

async function loadConversions(){
  const rows=await g('api/conversions');
  const card=$('#convCard');
  if(!rows.length){card.style.display='none';return;}
  card.style.display='block';
  $('#convList').innerHTML=rows.map(c=>`
    <div class="conv" style="margin-bottom:8px">
      <span><span class="tag tag-tr">在途</span> <b>${esc(c.member)}</b>
        ${esc(c.src_name||c.src_code)} → ${esc(c.tgt_name||c.tgt_code)}</span>
      <span class="pill">转出日 ${esc(c.out_date)} · ${esc(c.confirm_at||'待确认')}</span>
    </div>`).join('');
}

async function loadSummary(){
  const rows=await g('api/summary');
  const tb=$('#summaryTable tbody');tb.innerHTML='';
  rows.forEach((r,i)=>{
    const chg=r.day_chg, cls=chg>0?'up':(chg<0?'down':'flat');
    const crown=i===0?' <span class="crown">👑</span>':'';
    const pnl=r.pnl, pc=pnl>=0?'up':'down';
    tb.innerHTML+=`<tr style="cursor:pointer" onclick="filterBy('${esc(r.member)}')">
      <td>${esc(r.member)}${crown}</td>
      <td class="${cls}">${sign(chg)}%</td><td>¥${r.principal.toFixed(2)}</td>
      <td>¥${r.current.toFixed(2)}</td><td class="${pc}">${sign(pnl)}</td>
      <td class="${(r.realized||0)>0?'up':((r.realized||0)<0?'down':'flat')}">${r.realized?(r.realized>0?'+':'')+r.realized.toFixed(2):'—'}</td>
      <td>${r.cnt}</td></tr>`;
  });
  if(!rows.length) tb.innerHTML='<tr><td colspan="7" style="color:#999">暂无数据。</td></tr>';
}

async function loadRecords(){
  let rows=await g('api/records');
  if(currentFilter) rows=rows.filter(r=>r.member===currentFilter);
  const tb=$('#recTable tbody');tb.innerHTML='';
  $('#recFilter').innerHTML=currentFilter?`筛选：<b>${esc(currentFilter)}</b> · <a href="javascript:void(0)" onclick="filterBy('')">清除</a>`:'点成员名筛选';
  rows.forEach(r=>{
    const pend=!r.confirmed;
    tb.innerHTML+=`<tr data-id="${r.id}">
      <td data-f="member">${esc(r.member)}</td>
      <td data-f="fund_name">${esc(r.fund_name||r.fund_code)}<br><span class="pill">${esc(r.fund_code)}</span></td>
      <td data-f="principal">${r.principal.toFixed(2)}</td>
      <td>¥${r.current.toFixed(2)}</td>
      <td class="${r.last_change>0?'up':(r.last_change<0?'down':'flat')}">${sign(r.last_change||0)}%</td>
      <td class="${(r.realized_pnl||0)>0?'up':((r.realized_pnl||0)<0?'down':'flat')}">${r.realized_pnl?(r.realized_pnl>0?'+':'')+r.realized_pnl.toFixed(2):'—'}</td>
      <td data-f="confirmed" data-c="${r.confirmed?1:0}">${pend?'<span class="tag tag-pend">待确认</span>':'<span class="tag tag-ok">已确认</span>'}</td>
      <td class="row-actions"><button class="btn btn-g" onclick="editRow(this)">编辑</button>
      <button class="btn btn-g" onclick="toggleState(${r.id},${r.confirmed?0:1})">${r.confirmed?'转待确认':'确认'}</button>
      <button class="btn btn-d" onclick="delRow(${r.id})">删</button></td></tr>`;
  });
  if(!rows.length) tb.innerHTML='<tr><td colspan="8" style="color:#999">暂无记录。</td></tr>';
}

async function loadMembers(){
  const rows=await g('api/members');
  const tb=$('#memberTable tbody');tb.innerHTML='';
  rows.forEach(r=>{
    const has=r.cnt>0, pnl=r.pnl, pc=pnl>=0?'up':'down';
    tb.innerHTML+=`<tr style="cursor:pointer" onclick="filterBy('${esc(r.member)}')">
      <td>${esc(r.member)}${r.pend?` <span class="tag tag-pend">${r.pend}待确认</span>`:''}</td>
      <td>${r.cnt}</td><td>¥${r.principal.toFixed(2)}</td><td>¥${r.current.toFixed(2)}</td>
      <td class="${has?pc:'flat'}">${has?sign(pnl):'—'}</td>
      <td class="${(r.realized||0)>0?'up':((r.realized||0)<0?'down':'flat')}">${r.realized?(r.realized>0?'+':'')+r.realized.toFixed(2):'—'}</td>
      <td>${r.pend}</td></tr>`;
  });
  $('#memberList').innerHTML=rows.map(r=>`<option value="${esc(r.member)}">${esc(r.member)}</option>`).join('');
}
function filterBy(m){currentFilter=(m===currentFilter?'':m);loadRecords();loadSummary();}

async function fillFundOptions(){
  const recs=await g('api/records');
  const member=$('#sMember').value.trim();
  $('#sFund').innerHTML='<option value="">先选成员再选基金</option>'+
    recs.filter(r=>r.member===member).map(r=>`<option value="${esc(r.fund_code)}">${esc(r.fund_name||r.fund_code)}(${esc(r.fund_code)})</option>`).join('');
}
async function loadSchedules(){
  const rows=await g('api/schedules');
  const tb=$('#scheduleTable tbody');tb.innerHTML='';
  rows.forEach(r=>{
    tb.innerHTML+=`<tr data-m="${esc(r.member)}" data-fc="${esc(r.fund_code)}">
      <td>${esc(r.member)}</td><td>${esc(r.fund_name||r.fund_code)}(${esc(r.fund_code)})</td><td>${esc(r.confirm_at)}</td>
      <td class="row-actions"><button class="btn btn-g" onclick="editSchedule(this)">编辑</button>
      <button class="btn btn-d" onclick="delSchedule(this)">删</button></td></tr>`;
  });
  if(!rows.length) tb.innerHTML='<tr><td colspan="4" style="color:#999">当前没有预约计划。</td></tr>';
  fillFundOptions();
}
function editSchedule(btn){
  const tr=btn.closest('tr');const cell=tr.querySelector('td:nth-child(3)');
  if(btn.textContent==='编辑'){const cur=cell.textContent.trim();cell.innerHTML=`<input value="${esc(cur)}" style="width:100%">`;btn.textContent='保存';}
  else{const v=cell.querySelector('input').value.trim();if(!v){toast('请输入时间');return;}
    p('api/schedules',{member:tr.dataset.m,fund_code:tr.dataset.fc,confirm_at:v}).then(d=>{toast(d.ok?'已更新':'失败');loadSchedules();});}
}
function delSchedule(btn){
  const tr=btn.closest('tr');if(!confirm('删除该条预约？'))return;
  p('api/schedules/'+encodeURIComponent(tr.dataset.m)+'/'+encodeURIComponent(tr.dataset.fc)+'/delete').then(d=>{toast(d.ok?'已删除':'失败');loadSchedules();});
}
function toggleState(id,confirmed){
  p(`api/records/${id}/state`,{confirmed}).then(d=>{if(d.ok){toast(confirmed?'已确认':'转待确认');loadRecords();loadSummary();loadKpis();}else toast('失败');});
}
$('#sMember').addEventListener('input',()=>{fillFundOptions();});

function addRec(){
  p('api/records',{member:$('#aMember').value.trim(),fund_code:$('#aCode').value.trim(),
    fund_name:$('#aName').value.trim(),principal:$('#aPrincipal').value.trim()}).then(d=>{
    if(d.ok){toast('已新增');['aMember','aCode','aName','aPrincipal'].forEach(i=>$('#'+i).value='');
      loadRecords();loadSummary();loadKpis();}else toast('新增失败：'+d.error);});
}
function addSchedule(){
  p('api/schedules',{member:$('#sMember').value.trim(),fund_code:$('#sFund').value,confirm_at:$('#sAt').value.trim()}).then(d=>{
    if(d.ok){toast('已保存预约');$('#sAt').value='';loadSchedules();}else toast('失败：'+d.error);});
}

let editingId=null;
function editRow(btn){
  const tr=btn.closest('tr');editingId=tr.dataset.id;
  const get=f=>tr.querySelector(`[data-f="${f}"]`).textContent.trim();
  $('#eMember').value=get('member');$('#eCode').value=get('fund_code');
  $('#eName').value=get('fund_name');$('#ePrincipal').value=get('principal');
  $('#eConfirmed').value=tr.querySelector('[data-f="confirmed"]').dataset.c==='0'?'0':'1';
  $('#editModal').style.display='flex';
}
function closeModal(){$('#editModal').style.display='none';editingId=null;}
function saveEdit(){
  if(!editingId)return;
  p(`api/records/${editingId}/update`,{member:$('#eMember').value.trim(),fund_code:$('#eCode').value.trim(),
    fund_name:$('#eName').value.trim(),principal:$('#ePrincipal').value.trim(),confirmed:$('#eConfirmed').value==='1'}).then(d=>{
    if(d.ok){toast('已保存');closeModal();loadRecords();loadSummary();loadKpis();}else toast('失败：'+d.error);});
}
function delRow(id){if(!confirm('删除这条记录？'))return;
  p(`api/records/${id}/delete`).then(d=>{if(d.ok){toast('已删除');loadRecords();loadSummary();loadKpis();}else toast('失败');});}

bridgeReady().then(()=>{loadKpis();loadConversions();loadSummary();loadRecords();loadMembers();loadSchedules();});
</script>
</body>
</html>
