name: astrbot_plugin_emotion_route
display_name: 情感路线自适应注入
short_desc: 按意图选路线注入：危机→安全转介，倾诉→先共情，求策略→主动推进，混合→先接情绪再判断；情感路线本轮禁用口头禅。
desc: 情感/恋爱话题不再统一塞"主导版"文案。消息命中情感词后，用 router.py 分类：①危机信号（自伤/自杀）→ 安全优先、直接问、不保密、给 12356 等渠道；②倾诉/受伤/被吊着/被冷暴力 → 先接情绪、点破操控、不建议拿捏回去；③求追求/邀约/升温 → 给主动可执行的打法，同时守住不 PUA、不冷暴力、尊重拒绝的底线；④又受伤又想追 → 先接情绪再判断该进该退。每条路线都带本轮说话方式要求（至少两句、先接住再判断、不用"定死/别废话"这类硬词），并显式禁用"难绷/乐死/我嘞个/耍起/666/牛逼/神了/何意味/qwq"等玩梗口头禅，避免把共情回成段子。
author: astrbot-lele
version: v1.2.1
support_platforms:
  - qq_official
  - aiocqhttp
astrbot_version: ">=4.24.0,<5.0.0"
