name: astrbot_plugin_group_summary
display_name: 群趣事总结
short_desc: 按“话题连贯性 + 互动热度”挑群聊片段，用 LLM 写趣事并严格校验原话，配真实头像生成聊天截图风漫画；可选只读本机 QQ NT 历史，只发一张图。
desc: 插件在后台缓存每个群的最近消息（内存，可配条数与时间窗）。有人 @机器人 说“总结/群总结/趣事/好玩的事”时：可只读本机 NTQQ 的 nt_msg.db（经 qq-mcp 解密），只查配置的一个群、触发时补全最近 120 分钟，不查私聊、不把原始消息写盘；把最近消息按“m001…”编号整体交给 LLM，让它挑 2~3 段话题连贯的对话，而不是只给 4 个固定时间窗硬拼；LLM 只返回消息编号，渲染时按编号取原话，避免改写/编造。提示词要求一段只讲一个话题、标题具体、至少两人有来有回、描述不加原文没有的动机；后端校验编号存在、跨度合理、单人刷屏直接丢弃、desc 引号原话/提到的群友必须在选中消息里，并过滤纯媒体/XML，热度/参与人数按选中消息前后 90 秒的局部发言计算。LLM 最长等 15 秒，超时用候选原话兜底；头像预热与 LLM 并行。最后用 Pillow 画成带真实头像、热度/参与人数徽章、聊天气泡的“聊天截图风”漫画。只 yield 一次图片结果，不另发文字摘要。本地源不可用时自动回退 bot 缓存，头像下载失败回退彩色首字。
author: astrbot-lele
version: v0.3.2
support_platforms:
  - qq_official
  - aiocqhttp
astrbot_version: ">=4.24.0,<5.0.0"
